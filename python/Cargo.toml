[package]
name = "pyballista"
version = "55.0.0"
homepage = "https://datafusion.apache.org/ballista/"
repository = "https://github.com/apache/datafusion-ballista"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
description = "Apache DataFusion Ballista Python Client"
readme = "README.md"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.94.0"
include = ["/src", "/ballista", "/LICENSE.txt", "pyproject.toml", "Cargo.toml", "Cargo.lock"]
publish = false

[dependencies]

async-ffi = { version = "0.5" }
async-trait = { version = "0.1.92" }
ballista = { path = "../ballista/client", version = "55.0.0" }
ballista-core = { path = "../ballista/core", version = "55.0.0" }
ballista-executor = { path = "../ballista/executor", version = "55.0.0", default-features = false }
ballista-scheduler = { path = "../ballista/scheduler", version = "55.0.0", default-features = false }

# ballista = { version = "=55.0.0" }
# ballista-core = { version = "=55.0.0" }
# ballista-executor = { version = "=55.0.0", default-features = false }
# ballista-scheduler = { version = "=55.0.0", default-features = false }

# Version set to 55.2.0 as  Workaround for missing file-format 
# support in `datafusion-ffi` 55.2.0.
#
# Remove once `datafusion-ffi` delegates file formats to
# `DefaultLogicalExtensionCodec` in `ForeignLogicalExtensionCodec`.
#
# This relies on the private field layouts of `FFI_QueryPlanner` and
# `FFI_SessionRef`, mirrored below. It is only valid for the pinned
# `datafusion-ffi = "=55.2.0"`.
# see `src/ffi_planner_workaround.rs` for more details

datafusion = { version = "=55.2.0", features = ["avro"] }
datafusion-ffi = { version = "=55.2.0" }
datafusion-proto = { version = "=55.2.0" }
# datafusion-python 55.0.0 is not on crates.io yet, so build against its release
# candidate tag. Switch to `version = "=55.0.0"` once it is published, because
# the Python release check only accepts crates.io dependencies.
# datafusion-python = { git = "https://github.com/apache/datafusion-python.git", tag = "55.0.0-rc1", default-features = false }
datafusion-python = { version = "55.0.0", default-features = false }
log = { version = "0.4" }
prost = { version = "0.14" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3", "abi3-py310"] }
pyo3-log = "0.13"
stabby = { version = "72.1" }
tokio = { version = "1.48", features = ["macros", "rt", "rt-multi-thread", "sync"] }
tonic = { version = "0.14" }
url = { version = "2.5" }

[lib]
crate-type = ["cdylib"]
name = "ballista"

[build-dependencies]
pyo3-build-config = "0.29"
