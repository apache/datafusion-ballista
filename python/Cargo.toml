[package]
name = "pyballista"
version = "54.0.0"
homepage = "https://datafusion.apache.org/ballista/"
repository = "https://github.com/apache/datafusion-ballista"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
description = "Apache DataFusion Ballista Python Client"
readme = "README.md"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.82.0"
include = ["/src", "/ballista", "/LICENSE.txt", "pyproject.toml", "Cargo.toml", "Cargo.lock"]
publish = false

[dependencies]
async-trait = "0.1.89"
ballista = { path = "../ballista/client", version = "54.0.0" }
ballista-core = { path = "../ballista/core", version = "54.0.0" }
ballista-executor = { path = "../ballista/executor", version = "54.0.0", default-features = false }
ballista-scheduler = { path = "../ballista/scheduler", version = "54.0.0", default-features = false }
datafusion = { git = "https://github.com/apache/datafusion.git", rev = "e08aed1e5de41dcf81d529140dae07723b942a5e", features = ["avro"] }
datafusion-ffi = { git = "https://github.com/apache/datafusion.git", rev = "e08aed1e5de41dcf81d529140dae07723b942a5e" }
datafusion-proto = { git = "https://github.com/apache/datafusion.git", rev = "e08aed1e5de41dcf81d529140dae07723b942a5e" }
datafusion-python = { git = "https://github.com/apache/datafusion-python.git", rev = "55f43b5e231da5591e7bbd632dac85f304a22cca", default-features = false }
log = { version = "0.4" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3", "abi3-py310"] }
pyo3-log = "0.13"
tokio = { version = "1.48", features = ["macros", "rt", "rt-multi-thread", "sync"] }
tonic = { version = "0.14" }
url = { version = "2.5" }

[lib]
crate-type = ["cdylib"]
name = "ballista"

[build-dependencies]
pyo3-build-config = "0.29"

# datafusion-python's workspace patch does not apply when it is consumed as a
# dependency. Repeat its exact DataFusion patch here so the standalone Python
# crate uses one ABI-compatible DataFusion source family.
[patch.crates-io]
datafusion = { git = "https://github.com/apache/datafusion.git", rev = "e08aed1e5de41dcf81d529140dae07723b942a5e" }
datafusion-catalog = { git = "https://github.com/apache/datafusion.git", rev = "e08aed1e5de41dcf81d529140dae07723b942a5e" }
datafusion-common = { git = "https://github.com/apache/datafusion.git", rev = "e08aed1e5de41dcf81d529140dae07723b942a5e" }
datafusion-expr = { git = "https://github.com/apache/datafusion.git", rev = "e08aed1e5de41dcf81d529140dae07723b942a5e" }
datafusion-ffi = { git = "https://github.com/apache/datafusion.git", rev = "e08aed1e5de41dcf81d529140dae07723b942a5e" }
datafusion-functions-aggregate = { git = "https://github.com/apache/datafusion.git", rev = "e08aed1e5de41dcf81d529140dae07723b942a5e" }
datafusion-functions-window = { git = "https://github.com/apache/datafusion.git", rev = "e08aed1e5de41dcf81d529140dae07723b942a5e" }
datafusion-proto = { git = "https://github.com/apache/datafusion.git", rev = "e08aed1e5de41dcf81d529140dae07723b942a5e" }
datafusion-session = { git = "https://github.com/apache/datafusion.git", rev = "e08aed1e5de41dcf81d529140dae07723b942a5e" }
datafusion-spark = { git = "https://github.com/apache/datafusion.git", rev = "e08aed1e5de41dcf81d529140dae07723b942a5e" }
