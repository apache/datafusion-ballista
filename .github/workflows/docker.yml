name: Docker

permissions:
  contents: read
  packages: write

# Building the images means a full release build of the scheduler, executor
# and result service, which takes around 45 minutes. Pull requests only run it
# when the Docker artifacts change. The nightly run catches Rust changes that
# break the image build (for example a renamed binary) before a release tag
# depends on it.
on:
  pull_request:
    paths:
      - "dev/docker/**"
      - "dev/build-ballista-docker.sh"
      - "dev/build-ballista-executables.sh"
      - "dev/build-set-env.sh"
      - ".github/workflows/docker.yml"
  push:
    # The script below performs stricter validation before publishing. This
    # filter also excludes the separately released python-* tags.
    tags: ["[0-9]*"]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build_docker:
    name: Run Build Docker Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: true
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Setup Rust toolchain
        run: |
          rustup update stable
          rustup toolchain install stable
          rustup default stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 #2.9.3
      - name: Run script
        run: |
          git config --global --add safe.directory /__w/datafusion-ballista/datafusion-ballista

          ./dev/build-ballista-docker.sh

          docker tag apache/datafusion-ballista-standalone:latest ghcr.io/apache/datafusion-ballista-standalone:latest
          docker tag apache/datafusion-ballista-executor:latest ghcr.io/apache/datafusion-ballista-executor:latest
          docker tag apache/datafusion-ballista-scheduler:latest ghcr.io/apache/datafusion-ballista-scheduler:latest
          docker tag apache/datafusion-ballista-result-service:latest ghcr.io/apache/datafusion-ballista-result-service:latest

          # Publish Docker images only for Rust release tags. Use the triggering
          # ref instead of git describe because the final and RC tags can point
          # at the same commit.
          export DOCKER_TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "$DOCKER_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]
          then

            docker login ghcr.io --username "$DOCKER_USER" --password-stdin <<< "$DOCKER_PASS"

            echo "publishing docker tag $DOCKER_TAG"

            docker tag apache/datafusion-ballista-standalone:latest "ghcr.io/apache/datafusion-ballista-standalone:${DOCKER_TAG}"
            docker tag apache/datafusion-ballista-executor:latest "ghcr.io/apache/datafusion-ballista-executor:${DOCKER_TAG}"
            docker tag apache/datafusion-ballista-scheduler:latest "ghcr.io/apache/datafusion-ballista-scheduler:${DOCKER_TAG}"
            docker tag apache/datafusion-ballista-result-service:latest "ghcr.io/apache/datafusion-ballista-result-service:${DOCKER_TAG}"

            docker push "ghcr.io/apache/datafusion-ballista-standalone:${DOCKER_TAG}"
            docker push "ghcr.io/apache/datafusion-ballista-executor:${DOCKER_TAG}"
            docker push "ghcr.io/apache/datafusion-ballista-scheduler:${DOCKER_TAG}"
            docker push "ghcr.io/apache/datafusion-ballista-result-service:${DOCKER_TAG}"

            # An RC has not passed the ASF vote yet, so it must not replace the
            # latest approved release.
            if [[ ! "$DOCKER_TAG" =~ -rc[0-9]+$ ]]
            then
              echo "publishing docker tag latest"

              docker push ghcr.io/apache/datafusion-ballista-standalone:latest
              docker push ghcr.io/apache/datafusion-ballista-executor:latest
              docker push ghcr.io/apache/datafusion-ballista-scheduler:latest
              docker push ghcr.io/apache/datafusion-ballista-result-service:latest
            fi

          fi
        env:
          DOCKER_USER: ${{ github.actor }}
          DOCKER_PASS: ${{ secrets.GITHUB_TOKEN }}
