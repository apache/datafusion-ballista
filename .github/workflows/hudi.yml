name: Hudi integration

on:
  pull_request:
    paths:
      - "ballista/core/**"
      - "integrations/hudi/**"
      - ".github/workflows/hudi.yml"
  push:
    branches: [ "main" ]
    paths:
      - "ballista/core/**"
      - "integrations/hudi/**"
      - ".github/workflows/hudi.yml"
  workflow_dispatch:

jobs:
  distributed-read:
    runs-on: ubuntu-latest
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # 2.9.2
        with:
          workspaces: integrations/hudi
      - name: Test Hudi distributed read
        working-directory: integrations/hudi
        run: cargo test --test distributed_read
