name: Labeler trigger

# Starts the labeler for a pull request. This run gets a read-only token and
# does nothing itself. When it completes, dev_pr.yml runs from the default
# branch through `workflow_run` and applies the labels.
#
# A pull request runs its own copy of this file, so it can change or delete it.
# That only skips the labels for that pull request: dev_pr.yml reads nothing
# from this run except its head repository, branch and commit.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

jobs:
  trigger:
    name: Trigger
    runs-on: macos-latest
    steps:
      - name: Hand off to dev_pr.yml
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: 'echo "Labels for pull request #$PR_NUMBER are applied by dev_pr.yml"'
