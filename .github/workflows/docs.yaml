on:
  # Allow the docs site to be rebuilt and republished on demand, e.g. when a
  # push-triggered run was dropped and the change never made it to asf-site.
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths: &docs-paths
      - .asf.yaml
      - .github/workflows/docs.yaml
      - docs/**
      # Sources the docs pull in via literalinclude.
      - examples/examples/**
      - ballista/core/src/object_store.rs
  # Build pull requests too, so a docs warning fails the PR instead of reaching main.
  pull_request:
    paths: *docs-paths

name: Deploy DataFusion Ballista site

jobs:
  build-docs:
    name: Build docs
    runs-on: macos-latest
    steps:
      - name: Checkout docs sources
        uses: actions/checkout@v7.0.1

      - name: Checkout asf-site branch
        if: github.event_name != 'pull_request'
        uses: actions/checkout@v7.0.1
        with:
          ref: asf-site
          path: asf-site

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          set -x
          python3 -m venv venv
          source venv/bin/activate
          pip install -r docs/requirements.txt

      - name: Build docs
        env:
          # Pull requests fail on warnings; main publishes regardless, so one that
          # slips through (e.g. two PRs that are only broken together) can't block
          # the site from updating.
          SPHINXOPTS: ${{ github.event_name == 'pull_request' && '-W --keep-going' || '' }}
        run: |
          set -x
          source venv/bin/activate
          cd docs
          ./build.sh

      - name: Copy & push the generated HTML
        if: github.event_name != 'pull_request'
        run: |
          set -x
          cd asf-site/
          rsync \
            -a \
            --delete \
            --exclude '/.git/' \
            ../docs/build/html/ \
            ./
          cp ../.asf.yaml .
          touch .nojekyll
          git status --porcelain
          if [ "$(git status --porcelain)" != "" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add --all
            git commit -m 'Publish built docs triggered by ${{ github.sha }}'
            git push || git push --force
          fi
