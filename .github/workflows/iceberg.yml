# ballista-iceberg is its own workspace, outside Ballista's, and depends on a
# pinned commit of Ballista, so it doesn't block Ballista's build or release;
# this workflow checks it separately.
name: Ballista Iceberg

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
    paths:
      - "integrations/iceberg/**"
      - ".github/workflows/iceberg.yml"
      - "!**/*.md"
  pull_request:
    paths:
      - "integrations/iceberg/**"
      - ".github/workflows/iceberg.yml"
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: integrations/iceberg

jobs:
  test:
    name: check and test ballista-iceberg
    runs-on: ubuntu-latest
    container:
      image: amd64/rust
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 #2.9.3
        with:
          workspaces: integrations/iceberg
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: |
          rustup component add clippy
          cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --all-features --locked
