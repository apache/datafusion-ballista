# Spark settings for the Spark and Spark + Comet runs, one key=value per line.
# run.py adds the Kubernetes settings (image, namespace, executor count and
# CPUs, pod template, shuffle volume) and anything given with --spark-conf,
# which wins over this file.

# Executors. spark.executor.cores is task parallelism, not a CPU allocation:
# each executor pod gets --executor-cpus physical CPUs (8 by default), so
# Spark runs 16 tasks on 8 CPUs.
spark.executor.cores=16
spark.executor.memory=64G
spark.executor.memoryOverhead=10G
spark.memory.fraction=0.6
spark.memory.storageFraction=0.2

# Driver. It runs in the driver Job's pod (client mode); run.py sets
# spark.driver.memory from --driver-memory-gib.
spark.driver.maxResultSize=16g

# SQL
spark.sql.shuffle.partitions=512
spark.sql.broadcastTimeout=900
spark.sql.sources.ignoreDataLocality=true

# Serialization and compression
spark.serializer=org.apache.spark.serializer.KryoSerializer
spark.kryoserializer.buffer.max=240m
spark.io.compression.codec=zstd

# Wait for every executor before the first query, so it does not run on a
# partial cluster.
spark.scheduler.minRegisteredResourcesRatio=1.0
spark.scheduler.maxRegisteredResourcesWaitingTime=5min

# S3. Credentials come from the environment (the env_secret in cluster.toml)
# or the service account's web identity token (IRSA). The SDK's default chain
# is not used: when it cannot use the token it falls back to the node's
# instance role, and executors on nodes whose role cannot read the data fail
# with 403s while the others succeed.
spark.hadoop.fs.s3a.aws.credentials.provider=software.amazon.awssdk.auth.credentials.EnvironmentVariableCredentialsProvider,software.amazon.awssdk.auth.credentials.WebIdentityTokenFileCredentialsProvider
spark.hadoop.fs.s3a.connection.maximum=5000
spark.hadoop.fs.s3a.threads.max=20
spark.hadoop.parquet.io.stats.enabled=false
