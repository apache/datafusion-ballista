# What the Spark driver needs to run its executors: in client mode it creates
# the executor pods, a ConfigMap for them and, with a storage class, their
# shuffle volumes. Ballista and Trino only need the service account to exist.
#
#   kubectl -n ballista-benchmarks apply -f rbac.example.yaml
#
# Grant it read access to the data separately, for example by annotating the
# service account with an IAM role (eks.amazonaws.com/role-arn).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: benchmark
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["create", "get", "list", "watch", "delete", "deletecollection", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-driver
subjects:
  - kind: ServiceAccount
    name: benchmark
