<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 444" width="880" height="444" role="img" aria-label="Column chart of time per query, comparing Apache Spark 4.1.3, Ballista staged (default) and Ballista pipelined (experimental). Faster than Spark on 20 of 22 queries by default, on all 22 pipelined. The numbers are in the table in the benchmarking guide.">
  <style>
