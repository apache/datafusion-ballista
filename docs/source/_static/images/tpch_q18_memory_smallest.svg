  <path class="spark" d="M330 124H611Q615 124 615 128V140Q615 144 611 144H330Z"/>
  <path class="spark" d="M330 160H516Q520 160 520 164V176Q520 180 516 180H330Z"/>
  <path class="spark" d="M330 196H516Q520 196 520 200V212Q520 216 516 216H330Z"/>
  <path class="comet" d="M330 232H706Q710 232 710 236V248Q710 252 706 252H330Z"/>
  <path class="comet" d="M330 268H642.67Q646.67 268 646.67 272V284Q646.67 288 642.67 288H330Z"/>
  <path class="comet" d="M330 304H674.33Q678.33 304 678.33 308V320Q678.33 324 674.33 324H330Z"/>
  <line class="axis" x1="330" y1="80" x2="330" y2="336"/>

  <text class="label" x="320" y="103" text-anchor="end">Ballista</text>
  <text class="label" x="320" y="139" text-anchor="end">Spark, on-heap</text>
  <text class="label" x="320" y="175" text-anchor="end">Spark, on-heap, 2x overhead</text>
  <text class="label" x="320" y="211" text-anchor="end">Spark, 50% off-heap</text>
  <text class="label" x="320" y="247" text-anchor="end">Spark + Comet, 50% off-heap</text>
  <text class="label" x="320" y="283" text-anchor="end">Spark + Comet, 75% off-heap</text>
  <text class="label" x="320" y="319" text-anchor="end">Spark + Comet, 75% off-heap, 2x overhead</text>

  <text class="value" x="466.67" y="103">8 GiB<tspan class="detail"> · 132 s</tspan></text>
  <text class="value" x="625" y="139">18 GiB<tspan class="detail"> · 336 s</tspan></text>
  <text class="value" x="530" y="175">12 GiB<tspan class="detail"> · 406 s</tspan></text>
  <text class="value" x="530" y="211">12 GiB<tspan class="detail"> · 387 s</tspan></text>
  <text class="value" x="720" y="247">24 GiB<tspan class="detail"> · 160 s</tspan></text>
  <text class="value" x="656.67" y="283">20 GiB<tspan class="detail"> · 150 s</tspan></text>
  <text class="value" x="688.33" y="319">22 GiB<tspan class="detail"> · 174 s</tspan></text>

  <text class="note" x="24" y="358">Derived from TPC-H, not an official TPC-H result. 2 executors of 16 CPUs. Each size is a fresh cluster; mean of 2 runs.</text>
</svg>
