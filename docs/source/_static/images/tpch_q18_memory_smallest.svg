<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 372" width="880" height="372" role="img" aria-label="Bar chart of the smallest executor memory for TPC-H q18. Ballista: 8 GiB. Spark, on-heap: 18 GiB. Spark, on-heap, 2x overhead: 12 GiB. Spark, 50% off-heap: 12 GiB. Spark + Comet, 50% off-heap: 24 GiB. Spark + Comet, 75% off-heap: 20 GiB. Spark + Comet, 75% off-heap, 2x overhead: 22 GiB.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .bg { fill: #ffffff; }
    .title { font-size: 20px; font-weight: 600; }
    .sub { font-size: 14px; fill: #59636e; }
    .label { font-size: 14px; }
    .value { font-size: 14px; font-weight: 600; }
    .detail { font-weight: 400; fill: #59636e; }
    .legend { font-size: 13px; }
    .tick { font-size: 12.5px; fill: #59636e; }
    .note { font-size: 12.5px; fill: #59636e; }
    .grid { stroke: #e1e0d9; stroke-width: 1; }
    .axis { stroke: #c3c2b7; stroke-width: 1; }
    .comet { fill: #1baf7a; }
    .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .line.spark { stroke: #898781; }
    .line.staged { stroke: #2a78d6; }
    .line.comet { stroke: #1baf7a; }
    .ring { stroke: #ffffff; stroke-width: 2; }
    .cross { fill: none; stroke-width: 2.5; stroke-linecap: round; }
    .cross.spark { stroke: #898781; }
    .cross.staged { stroke: #2a78d6; }
    .cross.comet { stroke: #1baf7a; }
    .cross.key { stroke: #59636e; }
    .line.spark, .line.staged, .line.comet, .cross.spark, .cross.staged, .cross.comet { fill: none; }
    .spark { fill: #898781; }
    .staged { fill: #2a78d6; }
    .pipelined { fill: #eb6834; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .bg { fill: #0d1117; }
      .sub, .note, .tick, .detail { fill: #9198a1; }
      .grid { stroke: #21262d; }
      .axis { stroke: #3d444d; }
      .comet { fill: #199e70; }
      .line.staged, .cross.staged { stroke: #3987e5; }
      .line.comet, .cross.comet { stroke: #199e70; }
      .ring { stroke: #0d1117; }
      .cross.key { stroke: #9198a1; }
      .staged { fill: #3987e5; }
      .pipelined { fill: #d95926; }
    }
  </style>
  <rect class="bg" width="880" height="372" rx="6"/>
  <text class="title" x="24" y="36">Ballista finished in 8 GiB per executor, Spark needed 12 GiB and Spark + Comet 20 GiB</text>
  <text class="sub" x="24" y="60">Smallest executor memory at which TPC-H q18 (SF1000) finished with no executor out of memory, and its time there.</text>

