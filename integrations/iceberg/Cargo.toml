[package]
name = "ballista-iceberg"
description = "Apache Iceberg support for Ballista"
license = "Apache-2.0"
version = "56.0.0"
homepage = "https://datafusion.apache.org/ballista/"
repository = "https://github.com/apache/datafusion-ballista"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
keywords = ["iceberg", "ballista", "datafusion", "distributed"]
categories = ["database"]
edition = "2024"
# Required by the iceberg crates.
rust-version = "1.95"
# crates.io rejects the git dependencies on iceberg and iceberg-datafusion.
publish = false

# Its own workspace, outside Ballista's, so a DataFusion upgrade in Ballista
# that iceberg-rust doesn't support yet doesn't block Ballista's build or
# release. Built and tested by .github/workflows/iceberg.yml.
[workspace]

[package.metadata.cargo-machete]
# Not imported: enables the `serde` feature, to send a scan's Arrow schema.
ignored = ["arrow-schema"]

[dependencies]
arrow-schema = { version = "60.2.0", features = ["serde"] }
async-trait = "0.1"
# A commit on main, not the crates in this repo, so a change to Ballista
# doesn't break this build. 56.0.0-rc1 includes this commit, so move to
# crates.io once 56.0.0 is published.
ballista-core = { git = "https://github.com/apache/datafusion-ballista", rev = "446fa54c9949be15dc1f03a54ff2df360b24d0bf", version = "56.0.0" }
ballista-executor = { git = "https://github.com/apache/datafusion-ballista", rev = "446fa54c9949be15dc1f03a54ff2df360b24d0bf", version = "56.0.0", default-features = false, optional = true }
ballista-scheduler = { git = "https://github.com/apache/datafusion-ballista", rev = "446fa54c9949be15dc1f03a54ff2df360b24d0bf", version = "56.0.0", default-features = false, optional = true }
datafusion = "56"
datafusion-proto = "56"
futures = "0.3"
# Not released yet. Keep `iceberg` at the revision iceberg-datafusion's own
# workspace pins, so cargo resolves a single iceberg crate.
iceberg = { git = "https://github.com/apache/iceberg-rust", rev = "90e454aa51863afd0ad70dd92cf0a2aed1995e07" }
iceberg-datafusion = { git = "https://github.com/apache/datafusion-iceberg", rev = "73fc3bbcf3bef71ea36b2f57ca6f8e8b2ef442bb" }
# Storage for rebuilt tables: S3 and local files by default.
iceberg-storage-opendal = { git = "https://github.com/apache/iceberg-rust", rev = "90e454aa51863afd0ad70dd92cf0a2aed1995e07" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
arrow-flight = { version = "60.2.0", features = ["flight-sql"] }
ballista = { git = "https://github.com/apache/datafusion-ballista", rev = "446fa54c9949be15dc1f03a54ff2df360b24d0bf", version = "56.0.0", features = [
    "standalone",
] }
ballista-scheduler = { git = "https://github.com/apache/datafusion-ballista", rev = "446fa54c9949be15dc1f03a54ff2df360b24d0bf", version = "56.0.0", features = [
    "flight-sql",
] }
iceberg-catalog-rest = { git = "https://github.com/apache/iceberg-rust", rev = "90e454aa51863afd0ad70dd92cf0a2aed1995e07" }
tempfile = "3.27"
testcontainers = { version = "0.28", features = ["http_wait_plain"] }
tokio = { version = "1", features = ["macros"] }
tonic = "0.14"

[features]
# `ExecutorProcessConfigExt`, to ready an executor for Iceberg.
executor = ["dep:ballista-executor"]
# `SchedulerConfigExt`, to ready a scheduler for Iceberg.
scheduler = ["dep:ballista-scheduler"]
# Tests that need docker.
testcontainers = []

[[test]]
name = "flight_sql"
required-features = ["executor", "scheduler"]
