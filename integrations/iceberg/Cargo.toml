[package]
name = "ballista-iceberg"
description = "Apache Iceberg support for Ballista"
license = { workspace = true }
version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
authors = { workspace = true }
keywords = ["iceberg", "ballista", "datafusion", "distributed"]
categories = ["database"]
edition = { workspace = true }
# Required by the iceberg crates; the rest of the workspace still builds on 1.94.
rust-version = "1.95"
# crates.io rejects the git dependencies on iceberg and iceberg-datafusion.
publish = false

[package.metadata.cargo-machete]
# Not imported: enables the `serde` feature, to send a scan's Arrow schema.
ignored = ["arrow-schema"]

[dependencies]
arrow-schema = { version = "59.2.0", features = ["serde"] }
async-trait = { workspace = true }
ballista-core = { workspace = true }
datafusion = { workspace = true }
datafusion-proto = { workspace = true }
futures = { workspace = true }
iceberg = { workspace = true }
iceberg-datafusion = { workspace = true }
# Storage for rebuilt tables: S3 and local files by default.
iceberg-storage-opendal = { workspace = true }
serde = { workspace = true, features = ["derive", "rc"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }

[dev-dependencies]
ballista = { workspace = true, features = ["standalone"] }
iceberg-catalog-rest = { workspace = true }
tempfile = { workspace = true }
testcontainers = { version = "0.28", features = ["http_wait_plain"] }
tokio = { workspace = true, features = ["macros"] }

[features]
# Tests that need docker.
testcontainers = []
