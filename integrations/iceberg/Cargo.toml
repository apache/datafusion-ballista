[package]
name = "iceberg-ballista"
description = "Apache Iceberg distributed read/write driver for Ballista"
license = "Apache-2.0"
version = "54.0.0"
homepage = "https://datafusion.apache.org/ballista/"
repository = "https://github.com/apache/datafusion-ballista"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
keywords = ["iceberg", "ballista", "datafusion", "distributed"]
categories = ["database"]
edition = { workspace = true }
# Higher than the workspace MSRV on purpose: the iceberg crates require 1.94.
# Only this crate is affected — the rest of the workspace still builds on the
# workspace-wide rust-version.
rust-version = "1.94"
# The iceberg crates are consumed as git dependencies while the supporting
# changes live on a branch, and crates.io rejects git dependencies. Flip this
# back on once those crates are released and the deps below become versioned.
publish = false

[dependencies]
ballista-core = { path = "../../ballista/core", version = "54.0.0" }
datafusion = { workspace = true }
datafusion-proto = { workspace = true }
iceberg = { workspace = true }
iceberg-catalog-loader = { workspace = true }
iceberg-datafusion = { workspace = true }
iceberg-storage-opendal = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
tokio = { workspace = true }

[dev-dependencies]
arrow = { workspace = true }
ballista = { path = "../../ballista/client", version = "54.0.0", features = [
    "standalone",
] }
# Used by the multi-executor integration test to start a scheduler + several
# in-process executors directly. Feature flags mirror what ballista's
# `standalone` feature already enables, so these reuse the same compiled
# artifacts rather than triggering a separate build.
ballista-executor = { path = "../../ballista/executor", version = "54.0.0", default-features = false, features = [
    "arrow-ipc-optimizations",
] }
ballista-scheduler = { path = "../../ballista/scheduler", version = "54.0.0", default-features = false }
env_logger = { workspace = true }
iceberg-catalog-rest = { workspace = true }
log = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
default = []
# The end-to-end suite needs the Iceberg REST catalog + MinIO fixture in
# `dev/docker-compose.yaml`, so it is off by default and opted into explicitly:
#   cargo test -p iceberg-ballista --features integration-tests
integration-tests = []
