[package]
name = "ballista"
description = "Ballista Distributed Compute"
license = { workspace = true }
version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[dependencies]
async-trait = { workspace = true }
ballista-core = { workspace = true }
ballista-executor = { path = "../executor", version = "54.0.0", optional = true, default-features = false, features = [
    "arrow-ipc-optimizations",
] }
ballista-scheduler = { path = "../scheduler", version = "54.0.0", optional = true, default-features = false }
datafusion = { workspace = true }
log = { workspace = true }

tokio = { workspace = true }
url = { workspace = true }

[dev-dependencies]
ballista-executor = { workspace = true }
ballista-scheduler = { workspace = true }
ctor = { workspace = true }
datafusion-proto = { workspace = true }
env_logger = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
tonic = { workspace = true }
uuid = { workspace = true }

[features]
default = ["standalone"]
standalone = ["ballista-executor", "ballista-scheduler"]
# tests which need change of RUST_MIN_STACK in order for 
# tests to run. 
test_extended_stack = []
