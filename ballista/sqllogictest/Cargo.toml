[package]
name = "ballista-sqllogictest"
description = "Runs DataFusion's sqllogictest files against standalone Ballista"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
clap = { workspace = true }
datafusion = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
ballista = { workspace = true, features = ["standalone"] }
ballista-core = { workspace = true }
datafusion-proto = { workspace = true }
datafusion-sqllogictest = { workspace = true }
env_logger = { workspace = true }
futures = { workspace = true }
# indicatif and sqllogictest must be the versions `datafusion-sqllogictest` uses:
# its API takes their types.
indicatif = "0.18"
serde_json = { workspace = true }
sqllogictest = "0.29.1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }

[[test]]
name = "sqllogictests"
path = "tests/sqllogictests/main.rs"
harness = false
