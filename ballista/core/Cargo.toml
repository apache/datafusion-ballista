[package]
name = "ballista-core"
description = "Ballista Distributed Compute"
license = { workspace = true }
version = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"
authors = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
build = "build.rs"

# Exclude proto files so crates.io consumers don't need protoc
exclude = ["*.proto"]

[package.metadata.docs.rs]
rustc-args = ["--cfg", "docsrs"]

[features]
arrow-ipc-optimizations = []
build-binary = ["aws-config", "aws-credential-types", "clap", "object_store"]
default = ["arrow-ipc-optimizations"]
docsrs = []
# Used for testing ONLY: causes all values to hash to the same value (test for collisions)
force_hash_collisions = ["datafusion/force_hash_collisions"]
spark-compat = ["dep:datafusion-spark"]

[dependencies]
arrow-flight = { workspace = true }
async-trait = { workspace = true }
aws-config = { version = "1.8.18", optional = true }
aws-credential-types = { version = "1.2.0", optional = true }
chrono = { workspace = true }
clap = { workspace = true, optional = true }
datafusion = { workspace = true }
datafusion-proto = { workspace = true }
datafusion-proto-common = { workspace = true }
datafusion-spark = { workspace = true, optional = true, features = ["datafusion"] }
futures = { workspace = true }
log = { workspace = true }
object_store = { workspace = true, features = ["aws", "http"], optional = true }
parking_lot = { workspace = true }
pastey = { workspace = true }
prost = { workspace = true }
prost-types = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic = { workspace = true }
tonic-prost = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[build-dependencies]
rustc_version = "0.4.1"
tonic-build = { workspace = true }
tonic-prost-build = { workspace = true }
