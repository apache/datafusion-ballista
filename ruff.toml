# Ruff settings for Python outside `python/`, which keeps its own config in
# `python/pyproject.toml`. Ruff resolves the nearest config per file, so both
# apply when linting from the repository root.

[lint.per-file-ignores]
# Standalone benchmark scripts deliberately run code before importing: the
# db-benchmark harness expects a banner on stdout first, and tpch.py parses
# its arguments before importing the query engine.
"benchmarks/db-benchmark/*.py" = ["E402"]
"benchmarks/tpch.py" = ["E402"]
